[package]
name = "molentropy"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Estimate the configurational entropy of a molecule from a molecular dynamics trajectory."
authors = ["Helmut Carter <helmut.carter@lehman.cuny.edu>", "Tom Kurtzman"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/helmutcarter/molentropy"
documentation = "https://helmutcarter.github.io/molentropy/"
readme = "README.md"
keywords = ["entropy", "molecular-dynamics", "chemistry", "mutual-information"]
categories = ["science"]

[lib]
name = "molentropy"
crate-type = ["cdylib", "rlib"]

[dependencies]
kiddo = "5.3.1"
rayon = "1.5"
numpy = "0.21"
pyo3 = { version = "0.21", features = ["extension-module"] }
nalgebra = "0.35.0"

[dev-dependencies]
assert_approx_eq = "1.1.0"

[profile.release]
lto = "fat"     
codegen-units = 1

[features]
fma = []
