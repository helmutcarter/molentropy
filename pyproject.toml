[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "molentropy"
description = "Estimate the configurational entropy of a molecule from a molecular dynamics trajectory."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT OR Apache-2.0" }
authors = [
    { name = "Helmut Carter", email = "helmut.carter@lehman.cuny.edu" },
    { name = "Tom Kurtzman" },
]
dependencies = ["numpy"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://helmutcarter.github.io/molentropy/"
Repository = "https://github.com/helmutcarter/molentropy"
Changelog = "https://github.com/helmutcarter/molentropy/blob/main/CHANGELOG.md"
