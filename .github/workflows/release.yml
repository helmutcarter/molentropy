name: Release

# A tag vX.Y.Z builds the Python wheels and publishes a GitHub release with
# them attached; Zenodo archives each published release and mints its DOI.
# Pull requests that touch the packaging build the wheels without releasing.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - pyproject.toml
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: Check versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tag, Cargo.toml, CITATION.cff and CHANGELOG.md must agree, so the
      # archived release cites the version it contains.
      - name: Compare versions
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          citation_version=$(sed -n 's/^version: //p' CITATION.cff)
          echo "Cargo.toml: $cargo_version, CITATION.cff: $citation_version"
          test "$cargo_version" = "$citation_version"
          grep -q "^## \[$cargo_version\]" CHANGELOG.md
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v$cargo_version"
          fi

  wheels:
    name: Wheels (${{ matrix.name }})
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-latest, target: x86_64, test: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, test: true }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, test: true }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, test: false }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, test: true }
    steps:
      - uses: actions/checkout@v4

      # pyo3 0.21 supports Python 3.10 to 3.12; the extension is not abi3
      # because rust-numpy needs the full C API, so each version gets a wheel.
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --interpreter python3.10 python3.11 python3.12

      # The x86_64 macOS wheel is cross-built on an arm64 runner and cannot
      # run there.
      - name: Smoke test
        if: matrix.test
        shell: bash
        run: |
          python -m pip install numpy
          python -m pip install --no-index --find-links dist molentropy
          python tests/python_smoke.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist

  release:
    name: Publish release
    needs: wheels
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      # The release notes are this version's section of CHANGELOG.md.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## \[/ { if (found) exit; found = index($0, "[" v "]") > 0; next }
            found
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.whl \
            --title "molentropy $version" --notes-file notes.md --verify-tag
